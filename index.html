<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#130d1d">
  <meta name="description" content="一封由星光写成的信，送给江睿。">
  <meta name="robots" content="noindex,nofollow">
  <meta property="og:title" content="江睿 · 星光来信">
  <meta property="og:description" content="有些心意，想慢慢写给你。">
  <meta property="og:image" content="https://wang-090911.github.io/starlight-letter-jr/share.jpg">
  <meta property="og:url" content="https://wang-090911.github.io/starlight-letter-jr/">
  <title>江睿 · 星光来信</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%23f5b4db' d='M32 55C25 47 5 34 5 20C5 5 24 4 32 17C40 4 59 5 59 20C59 34 39 47 32 55Z'/%3E%3C/svg%3E">
  <style>
    :root{color-scheme:dark;--night:#130d1d;--ink:#e8b4d1}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--night)}
    body{font-family:system-ui,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
    ::selection{background:#8e4b74;color:#fff2fa}
    #stage{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);place-items:center;touch-action:manipulation}
    .art{grid-area:1/1;width:min(110vw,88vh,920px);height:auto;aspect-ratio:1;display:block}
    @supports(height:100svh){.art{width:min(110vw,88svh,920px)}}
    #still,#film{display:none;object-fit:contain}
    #loading{position:absolute;left:50%;top:47%;width:5px;height:5px;border-radius:50%;background:#f4bedb;box-shadow:0 0 15px 4px #bd76a780;animation:breathe 1.8s ease-in-out infinite}
    @keyframes breathe{50%{opacity:.3;transform:scale(.6)}}
    button{position:fixed;bottom:max(20px,env(safe-area-inset-bottom));right:max(18px,env(safe-area-inset-right));border:0;border-radius:50%;width:48px;height:48px;display:grid;place-items:center;color:var(--ink);background:transparent;cursor:pointer;transition:color .2s,background .2s}
    button[hidden]{display:none}
    button:hover,button:focus-visible{background:#392035;color:#fff1fa}
    button:focus-visible{outline:1px solid #e7a6d0;outline-offset:3px}
    button:active{background:#4a2942}
    button svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
    #notice{position:fixed;bottom:max(32px,env(safe-area-inset-bottom));left:24px;right:80px;margin:0;font-size:13px;line-height:1.8;color:#d9acc7}
    #notice:empty{display:none}
    @media(prefers-reduced-motion:reduce){#loading{animation:none}button{transition:none}}
  </style>
</head>
<body>
  <main id="stage" aria-label="献给江睿的星光粒子动画：爱心慢慢成形，散成星流，再写出江睿、love、小爱心和阿泷的署名。">
    <canvas id="heart" class="art" width="820" height="820" aria-hidden="true"></canvas>
    <video id="film" class="art" muted playsinline webkit-playsinline x5-playsinline x5-video-player-type="h5-page" preload="none" aria-label="星光来信动画"></video>
    <img id="still" class="art" src="final.jpg" alt="星光组成的江睿、love、小爱心和阿泷署名">
    <span id="loading" role="status" aria-label="星光正在汇聚"></span>
  </main>
  <p id="notice" role="status"></p>
  <button id="replay" type="button" hidden aria-label="重新播放动画" title="再看一遍">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9a8 8 0 1 1 .3 6.8M4 4v5h5"/></svg>
  </button>
  <script src="app.js"></script>
</body>
</html>
